# Builds the Windows installer and publishes it as a GitHub Release.
#
# Releasing is automatic: merge a change to master that sets a new "version" in package.json
# (with a matching "## What's new in X.Y.Z" section in README.md) and this workflow tags that
# commit and publishes the release. Pushes to master that don't change the version do nothing.
#
# Tagging by hand still works (git tag v1.3.1 && git push origin v1.3.1). A version that is
# already released is skipped, so a hand-made tag after an automatic release is harmless.
name: Release

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

# One release at a time, so a merge and a hand-made tag for the same version can't both publish it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides cheaply (on Linux) whether there is anything to release before starting the Windows build.
  plan:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.plan.outputs.go }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Is there a new version to release?
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is on a commit whose package.json says $tag. Merge the change that sets the new version first, then tag (or just merge: releases are automatic now)."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A tag made with -a is listed twice; the "^{}" line is the commit it points to.
          refs=$(git ls-remote --tags origin "refs/tags/$tag")
          tagged=$(printf '%s\n' "$refs" | grep -F '^{}' | cut -f1)
          [ -n "$tagged" ] || tagged=$(printf '%s\n' "$refs" | head -n 1 | cut -f1)
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::warning::$tag is already tagged on another commit ($tagged) but not released. Delete that tag or bump the version."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Prepare feature notes
        run: node scripts/release-notes.js

      - run: npm ci

      - name: Run tests
        run: npm test

      # After the notes and tests pass, so a failed check never leaves a tag behind.
      - name: Tag the release
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Build and publish
        run: npx electron-builder --win --publish always

      - name: Add feature notes to the published release
        shell: bash
        run: gh release edit "$TAG" --notes-file release-notes.md
